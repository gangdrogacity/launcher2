# Configurazione Build per macOS
# File di configurazione per personalizzare la build del launcher

# Informazioni applicazione
APP_NAME="WTF Modpack Launcher"
APP_BUNDLE_ID="com.wtfmodpack.launcher"
APP_VERSION="1.0.0"
APP_DESCRIPTION="Launcher per il modpack WTF di Minecraft"

# Percorsi
PYTHON_EXECUTABLE="python3"
PYINSTALLER_EXECUTABLE="pyinstaller"
BUILD_DIR="build"
DIST_DIR="dist"

# Opzioni build
BUILD_TYPE="app"  # "app" per .app bundle, "onefile" per eseguibile singolo
INCLUDE_CONSOLE="false"  # "true" per mostrare console di debug
OPTIMIZE_SIZE="true"     # "true" per ottimizzare la dimensione del file

# Icona
ICON_FILE="icon.icns"
ICON_SOURCE="icon.ico"

# Dipendenze extra (aggiungi librerie se necessarie)
EXTRA_HIDDEN_IMPORTS=""

# Directory da includere (separate da virgole)
INCLUDE_DIRS="fonts,authlib"

# File da includere (separati da virgole)
INCLUDE_FILES="README.md,requirements.txt,launcher_version.txt"

# Architetture target (per build universali)
TARGET_ARCH="universal2"  # "x86_64", "arm64", o "universal2"

# Versione minima macOS supportata
MIN_MACOS_VERSION="10.14"

# Note per lo sviluppatore:
# - Modifica APP_NAME per cambiare il nome dell'applicazione
# - Modifica APP_BUNDLE_ID per usare il tuo dominio
# - Aggiungi dipendenze extra in EXTRA_HIDDEN_IMPORTS se necessario
# - Includi file/directory aggiuntive in INCLUDE_DIRS/INCLUDE_FILES
